#@TYPE: Machine
#@NAME: milkv-duo
#@SOC: CVITEK CV1800B
#@DESCRIPTION: Machine configuration for Milk-V Duo

require conf/machine/include/riscv/tune-riscv.inc

MACHINE_FEATURES = "screen keyboard ext2 ext3 serial"

KERNEL_CLASSES = "kernel"
KERNEL_IMAGETYPE = "Image.gz"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-milkv-duo-dev"
PREFERRED_VERSION_openocd-native = "riscv"
PREFERRED_VERSION_openocd = "riscv"
UBOOT_MACHINE ?= "milkv-duo_defconfig"

SERIAL_CONSOLES = "115200;ttyS0"

IMAGE_FSTYPES += "wic.gz wic.bmap ext4"

## Do not update fstab file when using wic images
WIC_CREATE_EXTRA_ARGS ?= "--no-fstab-update"

# opensbi
RISCV_SBI_PLAT = "generic"

EXTRA_IMAGEDEPENDS += "milkv-duo-fsbl"

# Boot device selection: sd or nand
BOOT_DEV ?= "nand"

# Define boot files based on boot device
IMAGE_BOOT_FILES = " \
                    default.dtb \
                    fip.bin \
                    uEnv.txt \
                    uImage.fit \
                    ${@bb.utils.contains('BOOT_DEV', 'nand', '\
                    boot.spinand \
                    rootfs.spinand \
                    system.spinand ', '', d)} \
                    "

# Select WKS file based on boot device
WKS_FILE = "${@bb.utils.contains('BOOT_DEV', 'nand', 'milkv-duo-spinand.wks', 'milkv-duo.wks', d)}"

# Remove WIC formats when using NAND
IMAGE_FSTYPES:remove = "${@bb.utils.contains('BOOT_DEV', 'nand', 'wic wic.gz wic.bmap', '', d)}"
